name: microlearning_app
description: Aplicación móvil de microlearning con videos y flashcards educativas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # Storage & Cache
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  
  # Animations
  flutter_animate: ^4.3.0
  
  # Share
  share_plus: ^7.2.1
  
  # URL Launcher
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
