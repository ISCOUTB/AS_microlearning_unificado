<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoApp - Inicio de sesión</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 500px;
      padding: 30px 0;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(45deg, #fe2c55, #00f2ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 14px;
      color: #888;
      font-weight: 500;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 28px;
      transition: all 0.3s ease;
    }

    .form-box:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    h2 {
      text-align: center;
      color: white;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      transition: all 0.3s ease;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    input:focus {
      border-color: #fe2c55;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.1);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #fe2c55 0%, #ff6b9d 100%);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      margin-top: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(254, 44, 85, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(254, 44, 85, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    .divider {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 13px;
      margin: 10px 0;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 36px;
      }

      .form-box {
        padding: 24px 20px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎬 VideoApp</div>
    <div class="tagline">Comparte tus momentos favoritos</div>
  </header>

  <div class="container">
    <!-- Registro -->
    <div class="form-box">
      <h2>Crear cuenta</h2>
      <input type="text" id="regNombre" placeholder="Nombre completo" required>
      <input type="email" id="regCorreo" placeholder="Correo electrónico" required>
      <input type="password" id="regContrasena" placeholder="Contraseña" required>
      <button onclick="crearUsuario()">Registrarse</button>
    </div>

    <div class="divider">O</div>

    <!-- Inicio de sesión -->
    <div class="form-box">
      <h2>Iniciar sesión</h2>
      <input type="email" id="loginCorreo" placeholder="Correo electrónico" required>
      <input type="password" id="loginContrasena" placeholder="Contraseña" required>
      <button onclick="login()">Entrar</button>
    </div>
  </div>

  <div class="footer">
    <p>Microlearning · 2025</p>
  </div>

  <script>
    async function crearUsuario() {
      const nombre = document.getElementById('regNombre').value.trim();
      const correo = document.getElementById('regCorreo').value.trim();
      const contrasena = document.getElementById('regContrasena').value.trim();

      if (!nombre || !correo || !contrasena) {
        alert("Por favor completa todos los campos.");
        return;
      }

      const res = await fetch('/usuarios', {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, contrasena })
      });

      if (res.ok) {
        alert("✅ Usuario registrado correctamente. Ahora inicia sesión.");
      } else {
        const err = await res.json().catch(()=>({detail:"Error desconocido"}));
        alert("❌ Error al registrarse: " + (err.detail || res.status));
      }
    }

    async function login() {
      const correo = document.getElementById('loginCorreo').value.trim();
      const contrasena = document.getElementById('loginContrasena').value.trim();

      if (!correo || !contrasena) {
        alert("Por favor ingresa tus credenciales.");
        return;
      }

      const res = await fetch('/login', {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo, contrasena })
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem("usuarioId", data.id_usuario);
        localStorage.setItem("nombre", data.nombre);
        window.location.href = "/static/plataforma.html";
      } else {
        const err = await res.json().catch(()=>({detail:"Credenciales incorrectas"}));
        alert("❌ Error: " + (err.detail || res.status));
      }
    }
  </script>
</body>
</html>
